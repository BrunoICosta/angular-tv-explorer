<header class="header">
  <div class="container header__inner">
    <a class="brand" routerLink="/" aria-label="TV Explorer — página inicial">
      <span class="brand__logo"><app-icon name="tv" [size]="18" /></span>
      <span class="brand__name">TV<span>Explorer</span></span>
    </a>

    <nav class="nav" aria-label="Navegação principal">
      <ul class="nav__list">
        @for (item of navItems; track item.path) {
          <li>
            <a
              class="nav__link"
              [routerLink]="item.path"
              routerLinkActive="nav__link--active"
              [routerLinkActiveOptions]="{ exact: item.exact }"
              ariaCurrentWhenActive="page"
            >
              <app-icon [name]="item.icon" [size]="18" />
              <span class="nav__label">{{ item.label }}</span>
              @if (item.path === '/favoritos' && favoritesCount() > 0) {
                <span class="nav__badge">
                  {{ favoritesCount() }}
                  <span class="visually-hidden">séries salvas</span>
                </span>
              }
            </a>
          </li>
        }
      </ul>
    </nav>
  </div>
</header>
