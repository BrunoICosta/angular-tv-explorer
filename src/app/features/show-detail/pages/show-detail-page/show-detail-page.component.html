<div class="container page">
  <a class="back-link" routerLink="/">
    <app-icon name="arrowLeft" [size]="18" />
    {{ 'common.backToCatalog' | transloco }}
  </a>

  @let current = state();
  @switch (current.status) {
    @case ('loading') {
      <div class="detail-skeleton" aria-hidden="true">
        <div class="skeleton detail-skeleton__poster"></div>
        <div class="detail-skeleton__body">
          <div class="skeleton detail-skeleton__title"></div>
          <div class="skeleton skeleton-line"></div>
          <div class="skeleton skeleton-line"></div>
          <div class="skeleton skeleton-line skeleton-line--short"></div>
        </div>
      </div>
      <span class="visually-hidden" role="status">{{ 'showDetail.loading' | transloco }}</span>
    }
    @case ('not-found') {
      <app-state-message
        icon="tv"
        [title]="'showDetail.notFoundTitle' | transloco"
        [description]="'showDetail.notFoundDescription' | transloco"
      />
    }
    @case ('error') {
      <app-state-message
        variant="error"
        icon="refresh"
        [title]="'showDetail.loadError' | transloco"
        [description]="current.messageKey | transloco"
        [actionLabel]="'common.retry' | transloco"
        (action)="retry()"
      />
    }
    @case ('loaded') {
      <app-show-hero [show]="current.show">
        <app-favorite-button [show]="current.show" />
      </app-show-hero>
      <div class="detail-sections">
        <app-season-list [seasons]="current.show._embedded.seasons" />
        @defer (on viewport) {
          <app-cast-list [cast]="current.show._embedded.cast" />
        } @placeholder {
          <div class="cast-placeholder" aria-hidden="true">
            <div class="skeleton cast-placeholder__title"></div>
            <div class="skeleton cast-placeholder__row"></div>
          </div>
        }
      </div>
    }
  }
</div>
